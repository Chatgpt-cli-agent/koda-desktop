name: CI

# Runs the type checker and test suite on every PR and on pushes to main,
# so broken code is caught before it merges. Mirrors the Node version and
# install step already used by release.yml.

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Typecheck
        run: npm run typecheck

      # The app is Koda. Upstream can still merge in, and a merge can bring
      # the old brand back with it — this turns that into a build failure
      # instead of a silent regression.
      - name: Brand ratchet
        run: npm run check:brand

      # The brand ratchet only sees a standalone capital-H "Hermes". The
      # engine's technical spellings — `hermes-agent`, `~/.hermes`,
      # `HERMES_HOME`, `hermesone.org` — are contracts, and a rename of one
      # breaks the engine without breaking the build.
      - name: Contract ratchet
        run: npm run check:contracts

      # A translation key that does not exist renders as its own raw path in
      # the UI. Renaming one without renaming its consumer is silent, so it
      # is a build failure here instead.
      - name: Translation key ratchet
        run: npm run check:i18n

      - name: Install fish for SSH command regression tests
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Test
        env:
          HERMES_TEST_FISH: "1"
        run: npm test

      - name: Lint
        run: npm run lint
