appId: com.koda.desktop
# productName is space-free so the Linux .deb installs to
# /opt/Koda/koda-desktop instead of `/opt/Koda One/koda-desktop`.
# The previous path crashed Chromium's zygote on launch because
# argv[0] containing whitespace is forwarded verbatim into execvp and
# fails with EINVAL (SIGTRAP). See issue #877.
#
# The user-facing display name "Koda" is restored through
# `linux.desktop.entry.Name`, `nsis.shortcutName`, `nsis.uninstallDisplayName`,
# and `mac.extendInfo.CFBundleDisplayName` so end users see no change.
productName: Koda
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/prebuilds/*.node
win:
  executableName: koda
  target:
    - nsis
    - portable
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  # Restore user-facing installer / shortcut name now that productName is
  # space-free.
  shortcutName: Koda
  uninstallDisplayName: Koda
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
mac:
  # The bundle is "Koda.app" and the binary inside it is "Koda". The
  # auto-updater resolves a release by artifact name, and the artifact names
  # come from package.json's `name` — koda-desktop, not hermes-desktop.
  executableName: Koda
  artifactName: ${name}-${version}-${arch}-${os}.${ext}
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - CFBundleDisplayName: Koda
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: electronjs.org
  vendor: Koda
  category: Utility
  synopsis: Koda autonomous AI agent desktop app
  description: >-
    Koda is an autonomous AI agent desktop application powered by the Koda Agent
    execution harness.
  # Override the user-facing .desktop display name (default would now be
  # "Koda" since productName is space-free). See issue #877.
  desktop:
    entry:
      Name: Koda
      Comment: Koda — autonomous AI agent desktop app
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
# Keep Electron Builder's default DEB/RPM hooks: they install compatible
# AppArmor policy, select sandbox permissions, and update desktop integration.
rpm:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  # The auto-updater feed is Koda's OWN releases, never upstream's. If it
  # pointed at fathah/hermes-desktop, an upstream release would install a
  # upstream build straight over this install — reintroducing the old
  # brand and identity. Upstream still reaches Koda the safe way: merge
  # upstream into this repo, then cut a Koda release from the result.
  owner: Chatgpt-cli-agent
  repo: hermes-desktop
